name: tests

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install package (CPU torch) + extras
        run: uv pip install --torch-backend=cpu -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check combinator

